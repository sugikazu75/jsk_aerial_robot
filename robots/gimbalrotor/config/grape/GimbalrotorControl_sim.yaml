aerial_robot_control_name: aerial_robot_control/gimbalrotor_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : false

  # external wrench estimation
  wrench_estimate_flag: true
  wrench_estimate_update_rate: 200
  momentum_observer_force_weight: 10
  momentum_observer_torque_weight: 10
  wrench_compensation_flag: true
  wrench_compensation_mask: [1, 1, 1, 0, 0, 1] # [fx, fy, fz (world frame), tx, ty, tz (CoG frame)]
  wrench_compensation_start_delay: 0.5 # wait for the convergence of the estimation after hovering [s]
  wrench_compensation_average_duration: 1.0 # average the estimation for the hand over of the I term [s]
  wrench_compensation_force_std_thresh: 0.5 # retry the averaging if the estimation fluctuates (e.g., touched) [N]
  wrench_compensation_torque_std_thresh: 0.05 # [Nm]

  xy:
    p_gain: 2.0
    i_gain: 0.05
    d_gain: 1.5
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 10.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true

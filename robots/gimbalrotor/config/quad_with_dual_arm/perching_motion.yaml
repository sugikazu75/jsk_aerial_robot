# Parameters of scripts/planning/plan_perching_motion.py (all of them; each one can be overridden on the
# command line as --key-with-dashes value).

# files: package://<package>/... or paths
robot: package://gimbalrotor/robots/quad_with_dual_arm/gimbalrotor.urdf.xacro
scene: package://gimbalrotor/urdf/environment/perching_environment.urdf.xacro
output: package://gimbalrotor/config/quad_with_dual_arm/trajectories/perching_motion.json

# the scene: read by urdf/environment/perching_environment.urdf.xacro (config:=this file; drawn by
# bringup.launch and perching_motion.launch) and scripts/simulation/make_perching_world.py (the MuJoCo world).
# The task frame: bar_x, bar_z, start and the plan are in it; in it the robot comes from +x and hangs
# its front arm (heading +x) on the bar, its rear arm held out to -x. It is placed in the world by
# task_frame [x, y, yaw]: the plan written is in the world. yaw pi: the robot comes from world -x
# towards +x, and its rear arm is held out to world +x
task_frame: [0.0, 0.0, 3.141592653589793]  # [m, m, rad]
bar_x: 0.0          # [m]
bar_z: 1.075          # [m]
bar_radius: 0.03   # [m] cylindrical approximation of the real 0.05 m square bar

# the task
start: [1.2, 0.0, 0.8]  # [m] hover position of the root (task frame)
# the arms (front and back the same) at the start, on the ground and in the hover: joint1 down so that
# link1 reaches the ground, joint2 and joint3 folded up. The replay (follow_trajectory.py,
# perching_task.py) sends the first frame on the ground before the takeoff
folded_joints: [0.6, -2.4, -0.85]   # [rad] joint1, joint2, joint3
# the rear arm while hanging: held out in front, the hand horizontal at about (0.64, 0.65) in the world,
# away from the joint limits and from the stretched (singular) arm, where the IK of hanging_teleop.py and
# hand_accuracy_test.py starts
hang_rear_joints: [0.0, 1.2, -1.2]  # [rad] joint1, joint2, joint3
hook_tilt: 0.0          # [rad] near-vertical hook approach: clears the lower real bar in the pre-hook flight
hook_pitch_range: 0.15  # [rad] the hook turns on the bar (a hinge about it: pitch only) by up to this from
                        #       hook_tilt (0: fixed); tilt + range within atan(friction) for a vertical load
hook_pitch_weight: 1.0  # per rad, pulling the pitch of the hook back to hook_tilt
friction: 0.5           # of the hook on the bar
approach: 0.16          # [m] along the opening of the hook onto the bar (the hook clear of it by bar_margin;
                        #     longer brings the body and the first link of the front arm up into the bar)

# the statics
min_lift: 0.25           # share of the weight the rotors carry at least (each the same, along up)
max_effort_ratio: 0.75   # share of the URDF effort limit each joint may take (also the optimisation's)
max_thrust_tilt: 1.5707963267948966  # [rad] of the thrust from up (also the gimbal limits of the optimisation)

# the body attitude: R = R_ref exp(offset)
reference_attitude: [0.0, 0.0, 0.0]  # [rad] roll, pitch, yaw of R_ref
max_body_tilt: 0.3                   # [rad] the largest offset, on each component; 0: at R_ref
attitude_mask: [1, 1, 1]             # roll, pitch, yaw: 1 free within max_body_tilt, 0 fixed at reference
attitude_weight: 3.0                 # IK residual pulling the offset back to zero (per rad)

# the flight planning (OMPL RRTConnect)
margin: 0.03         # [m] clearance from the scene in flight
bar_margin: 0.08     # [m] clearance of the front arm passing over the bar (link2, link3, hook) from it in flight
hull_margin: 0.02    # [m] CoM inside the rotor hull
thrust_margin: 1.3   # lift capacity / weight
time: 60.0           # [s] planning time limit
range: 0.3           # RRTConnect step
simplify_time: 1.0  # [s] OMPL path simplification (shortcuts) after the search; 0: none, the raw RRTConnect path, which winds (the root about twice the straight distance) and which the optimisation does not straighten (it has no collision constraints and tracks the plan). Not a hard limit: one pass of it takes ~10 s whatever this is
resolution: 0.005    # edge check resolution (fraction)
seed: 1

# the timing: frames = duration x rate (the IK of the unhook is solved at a fixed number of points, then
# timed, so that the durations do not change the path)
rate: 20.0                   # [Hz] of the output frames
hover_time: 2.0              # [s]
flight_speed: 0.15           # [m/s] the root in flight at most
flight_rotation_speed: 0.25  # [rad/s] the root attitude in flight at most
flight_joint_speed: 0.4      # [rad/s] the joints in flight at most
pre_time: 1.0                # [s] held off the bar before the approach (the corner of the path)
approach_time: 2.0           # [s]
load_time: 2.0               # [s] the load moved from the rotors onto the bar
hang_time: 2.0               # [s]
# leaving the bar: the load back onto the rotors, then the hook out of the
# bar the way it came in (back along its opening by unhook_distance, its pose held) while the body goes
# down by unhook_drop, the arms taking the difference; then held there (on by teleoperation). The
# arms limit the drop: with the hook 0.2 m out, about 0.03 m keeps the hook on its path (a larger one
# drifts it off by more than the 8 mm the bar has in the opening)
release_time: 2.0            # [s] (as the ramp_time of the contacts of the whole-body controller)
unhook_time: 3.0             # [s]
unhook_ik_steps: 20
unhook_distance: 0.2         # [m] the hook back along its opening (clear of the bar by bar_margin at the end)
unhook_drop: 0.03            # [m]

# for the trajectory optimisation
armature: 0.01  # [kg m^2] reflected inertia of the servos (assumed, not measured)

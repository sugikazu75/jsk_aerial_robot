servo_controller:

  joints:
    # for low pass filter
    filter_flag: true
    sample_freq: 50.0 # 50Hz
    cutoff_freq: 10.0 # 10Hz, test

    # for simulation
    simulation:
      pid: {p: 10.0, i: 0.0, d: 1.0, i_clamp_min: -6.6, i_clamp_max: 6.6}
      init_value: 0.0
      # type: effort_controllers/JointComputeTorqueController
      type: effort_controllers/JointPositionController

    controller1:
      name: front1_roll
    controller2:
      name: gimbal1_pitch
    controller3:
      name: end1_roll
    controller4:
      name: joint1_yaw
      simulation:
        init_value: 1.57
    controller5:
      name: front2_roll
    controller6:
      name: gimbal2_pitch
    controller7:
      name: end2_roll
    controller8:
      name: joint2_yaw
      simulation:
        init_value: 1.57
    controller9:
      name: front3_roll
    controller10:
      name: gimbal3_pitch
    controller11:
      name: end3_roll
    controller12:
      name: joint3_yaw
      simulation:
        init_value: 1.57
    controller13:
      name: front4_roll
    controller14:
      name: gimbal4_pitch
    controller15:
      name: end4_roll

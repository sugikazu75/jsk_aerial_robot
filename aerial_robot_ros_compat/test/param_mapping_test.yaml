param_probe:
  ros__parameters:
    uav_model: 7
    estimation:
      mode: 2
      sensor_list: ["sensor_plugin/imu", "sensor_plugin/mocap"]
    motor_info:
      max_pwm: 0.85
      ref1:
        voltage: 11.1
        # A whole number, exactly as the robot config files write them. Under
        # ROS2 that is an integer parameter, and the call site wants a double.
        max_thrust: 8
    whole_number_gain: 3
    fractional_index: 2.5
